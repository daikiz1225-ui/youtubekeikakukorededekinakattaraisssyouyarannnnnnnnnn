<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="style.css">

    <script src="allowlist.js"></script>

    <script>
    (function() {
        // デバイス固有IDの生成
        async function getSecureID() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
            
            const specs = [
                navigator.userAgent,
                screen.width + "x" + screen.height,
                navigator.hardwareConcurrency,
                renderer,
                "YT_PREMIUM_SECURE_v2"
            ].join('|');

            let hash = 0;
            for (let i = 0; i < specs.length; i++) {
                hash = ((hash << 5) - hash) + specs.charCodeAt(i);
                hash |= 0;
            }
            return "DEV-" + Math.abs(hash).toString(36).toUpperCase();
        }

        async function applyGuard() {
            const currentID = await getSecureID();
            
            // 許可リストにIDがあるかチェック
            const isAllowed = (typeof ALLOWED_IDS !== 'undefined' && ALLOWED_IDS.includes(currentID));

            if (isAllowed) {
                document.title = "YouTube Premium Client";
            } else {
                // 未承認時の404画面（タイトル全体がスイッチ）
                document.documentElement.innerHTML = `
                    <style>
                        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fff; color: #000; overflow: hidden; }
                        .error-title { font-size: 50px; margin-bottom: 10px; cursor: default; user-select: none; padding: 20px; }
                        p { font-size: 20px; }
                        .id-overlay { 
                            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                            background: #000; color: #fff; z-index: 10000; 
                            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
                        }
                        .id-code { background: #222; padding: 20px; border-radius: 10px; color: #0f0; font-size: 30px; font-family: monospace; margin: 20px 0; border: 1px solid #444; }
                        .copy-btn { background: #0055ff; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; }
                    </style>
                    <h1 class="error-title" onclick="handleSecretClick()">404 Not Found</h1>
                    <p>The requested URL was not found on this server.</p>
                    <hr><address>Apache Server at ${window.location.hostname} Port 443</address>
                    
                    <div id="idOverlay" class="id-overlay">
                        <h1>端末承認が必要</h1>
                        <p>このIDをコピーして開発者に送ってください：</p>
                        <div class="id-code">${currentID}</div>
                        <button class="copy-btn" onclick="copyText('${currentID}')">IDをコピーする</button>
                        <p style="margin-top:40px; color:#555;" onclick="location.reload()">閉じる</p>
                    </div>

                    <script>
                        let clickTimer = null;
                        let clicks = 0;
                        function handleSecretClick() {
                            clicks++;
                            if (clicks >= 5) { // 5回連続タップで発動
                                document.getElementById('idOverlay').style.display = 'flex';
                                clicks = 0;
                            }
                            clearTimeout(clickTimer);
                            clickTimer = setTimeout(() => { clicks = 0; }, 2000); // 2秒間操作がないとリセット
                        }
                        function copyText(text) {
                            navigator.clipboard.writeText(text);
                            alert("コピーしました！");
                        }
                    <\/script>
                `;
                window.stop();
            }
        }
        applyGuard();
    })();
    </script>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="Actions.goHome()">
            <span class="logo-red">▶</span> Premium
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <div class="nav-item" onclick="Actions.showGame()" style="color: #4CAF50; font-weight: bold;">🎮<span>ゲーム</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <script src="game.js"></script>
    <script src="tetris.js"></script>
    <script src="snake.js"></script>
    <script src="reversi.js"></script>
    <script src="shogi.js"></script>
    <script src="blockblast.js"></script>
    <script src="game2048.js"></script>
    <script src="towerdefense.js"></script>
    <script src="airhockey.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
