<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #111; color: white; transition: background 0.3s;">

    <aside id="sidebar">
        <div class="logo">kick tube</div>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <form id="search-form" class="search-container" style="display:flex; gap:10px; padding:20px;">
                <input type="text" id="search-input" placeholder="動画を検索..." style="flex:1; padding:15px; font-size:16px;">
                <button id="search-button" type="submit" style="padding:15px 30px; background:red; color:white; font-weight:bold; border:none; border-radius:8px;">検索</button>
            </form>
        </header>

        <section id="view-home">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">検索ワードを入力してね</div>
            </div>
        </section>
    </main>

    <script src="js/config.js?v=8.0"></script>
<script src="js/ui-switcher.js?v=8.0"></script>
<script src="js/search-engine.js?v=8.0"></script>
<script src="js/thumbnail-list.js?v=8.0"></script>
<script src="js/player.js?v=8.0"></script>
<script src="js/main.js?v=8.0"></script>

</body>
</html>
