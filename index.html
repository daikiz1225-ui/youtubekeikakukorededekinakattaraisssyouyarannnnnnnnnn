<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Tube</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="Actions.goHome()">
            <span class="logo-red">●</span><span>Tube</span>
        </div>
        <div class="search-bar-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="検索">
                <button id="search-btn" onclick="Actions.search('normal')">🔍</button>
            </div>
        </div>
        <div class="user-icons">
            <button id="secret-btn" onclick="Actions.toggleSecret()">🕶️</button>
        </div>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()"><span>🏠</span><span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()"><span>🎬</span><span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()"><span>📡</span><span>ライブ</span></div>
            <div class="nav-item" onclick="Actions.showSubs()"><span>👥</span><span>登録チャンネル</span></div>
            <div class="nav-item" onclick="Actions.showHistory()"><span>🕒</span><span>履歴</span></div>
            <div class="nav-item" onclick="Actions.showGame()"><span>🎮</span><span>ゲーム</span></div>
        </nav>
        <main class="content" id="view-container">
            </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
