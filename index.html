<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick Tube - Fixed</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        header { padding: 20px; background: #222; position: sticky; top: 0; z-index: 100; }
        .search-box { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
        button { padding: 12px 20px; background: #f00; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .video-card { cursor: pointer; transition: 0.2s; }
        .video-card:active { transform: scale(0.95); }
        .video-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .video-card h3 { font-size: 13px; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #view-player { padding: 15px; display: none; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="view-home">
        <header>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="動画を検索..." onkeypress="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">検索</button>
            </div>
        </header>
        <div id="search-results" class="video-grid">
            <p style="text-align:center; color:#666; grid-column: 1/-1; margin-top: 50px;">検索ワードを入力してください</p>
        </div>
    </div>

    <div id="view-player">
        <button onclick="goBack()" style="background:#333; margin-bottom:15px; color:white; padding:10px 15px; border:none; border-radius:8px;">← 戻る</button>
        <div class="player-wrapper" id="player-container"></div>
        <h1 id="player-title" style="font-size:18px; margin-top:15px;"></h1>
    </div>

    <script>
        // 🚨 ここにだいきの新しいAPIキーを入れてくれ
        const MY_API_KEY = "YOUR_API_KEY_HERE"; 
        // 最強の通行証ID
        const EDU_ID = "o-hmiN9tvUUI2EQM";

        async function doSearch() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '<p style="text-align:center; grid-column:1/-1;">検索中...</p>';

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${MY_API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) {
                    resultsContainer.innerHTML = `<p style="color:red; grid-column:1/-1;">エラー: ${data.error.message}</p>`;
                    return;
                }

                resultsContainer.innerHTML = '';
                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const thumb = item.snippet.thumbnails.high.url;

                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => startPlay(videoId, title);
                    card.innerHTML = `
                        <img src="${thumb}">
                        <h3>${title}</h3>
                    `;
                    resultsContainer.appendChild(card);
                });
            } catch (e) {
                resultsContainer.innerHTML = '<p style="grid-column:1/-1;">通信に失敗しました</p>';
            }
        }

        function startPlay(id, title) {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-player').style.display = 'block';
            document.getElementById('player-title').innerText = title;

            const videoUrl = `https://www.youtubeeducation.com/embed/${id}?edufilter=${EDU_ID}&rel=0&autoplay=1`;

            document.getElementById('player-container').innerHTML = `
                <iframe src="${videoUrl}" frameborder="0" style="width:100%; height:100%;" allowfullscreen allow="autoplay"></iframe>
            `;
        }

        function goBack() {
            document.getElementById('view-home').style.display = 'block';
            document.getElementById('view-player').style.display = 'none';
            document.getElementById('player-container').innerHTML = '';
        }
    </script>
</body>
</html>
