<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
(function () {

    const LOCK_KEY = 'youtube_unlocked';

    // 1225 の SHA-256
    const PASSWORD_HASH =
    'a8c0cce8bb067e91d7b0f39b9e2f97df8c8079f71e3f26f1f8c1e2e4e2f7d5d0';

    async function sha256(text) {

        const data = new TextEncoder().encode(text);

        const hashBuffer = await crypto.subtle.digest(
            'SHA-256',
            data
        );

        return Array.from(
            new Uint8Array(hashBuffer)
        )
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function boot() {

        const urlObj =
        new URL(window.location.href);

        const currentMode =
        urlObj.searchParams.get('mode');

        // =========================
        // ログイン
        // =========================
        if (currentMode === 'python-study') {

            const input =
            prompt('パスワードを入力');

            // キャンセル
            if (input === null) {

                window.location.replace(
                    window.location.origin +
                    window.location.pathname
                );

                return;
            }

            const inputHash =
            await sha256(input);

            // 成功
            if (inputHash === PASSWORD_HASH) {

                localStorage.setItem(
                    LOCK_KEY,
                    'true'
                );

                // URLを綺麗にする
                window.location.replace(
                    window.location.origin +
                    window.location.pathname
                );

                return;
            }

            // 失敗
            alert('パスワードが違います');

            window.location.replace(
                window.location.origin +
                window.location.pathname
            );

            return;
        }

        // =========================
        // シャットダウン
        // =========================
        if (currentMode === 'shutdown') {

            localStorage.removeItem(
                LOCK_KEY
            );

            window.location.replace(
                window.location.origin +
                window.location.pathname
            );

            return;
        }

        // =========================
        // 未認証時
        // =========================
        if (
            localStorage.getItem(LOCK_KEY)
            !== 'true'
        ) {

            document.write(`
                <title>
                    Python 3.12 実行環境における高度な
                    メモリ管理とセキュリティ・プロトコル
                </title>

                <style>
                    :root{
                        --p:#3776ab;
                        --bg:#ffffff;
                        --t:#1e293b;
                    }

                    body{
                        margin:0;
                        font-family:
                        'Segoe UI',
                        system-ui,
                        sans-serif;

                        background:var(--bg);
                        color:var(--t);
                        line-height:2;
                    }

                    .wrap{
                        max-width:1000px;
                        margin:auto;
                        padding:60px 30px;
                    }

                    h1{
                        color:var(--p);
                        font-size:2.5rem;
                    }

                    p{
                        font-size:1.1rem;
                    }

                    .box{
                        background:#f8fafc;
                        padding:30px;
                        border-left:10px solid var(--p);
                        margin-top:40px;
                        border-radius:10px;
                    }
                </style>

                <div class="wrap">

                    <h1>
                        Python Runtime Security
                    </h1>

                    <p>
                        CPython Runtime Analysis...
                    </p>

                    <div class="box">

                        最近のWebサイト管理手法として、
                        URLの末尾にキーを入れて
                        ローカルストレージにキー保存させる
                        サイト最近増えてきましたねー、、、

                    </div>

                    <p>
                        Secure Runtime Environment...
                    </p>

                </div>
            `);

            // 本物HTML停止
            window.stop();

            return;
        }
    }

    boot();

})();
</script>

    <link id="favicon" rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <title>GoogIe</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 【修正版シャットダウン】 確実にパラメータなしのURLへ飛ばしてロックをかける
        function shutdown() {
            localStorage.removeItem('youtube_unlocked');
            // パラメータなしのトップページURLを取得してリダイレクト
            const rootUrl = window.location.origin + window.location.pathname;
            window.location.href = rootUrl; 
        }
    </script>
