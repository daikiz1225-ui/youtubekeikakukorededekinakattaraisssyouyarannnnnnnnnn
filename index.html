<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside id="sidebar">
        <div class="logo">kick tube</div>
        <nav id="channel-list">
            </nav>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="動画を検索..." autocomplete="off">
                <button id="search-button" type="button">検索</button>
            </div>
        </header>

        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">
                    検索ワードを入力してください
                </div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div id="player-container"></div>
            <div id="video-controls" style="padding:20px; text-align:center;">
                <button id="reload-video" class="btn">🔄 再読み込み</button>
                <button id="back-to-home" class="btn">⬅️ 戻る</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/ui-switcher.js"></script>
    <script type="module" src="js/search-engine.js"></script>
    <script type="module" src="js/thumbnail-list.js"></script>
    <script type="module" src="js/player.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
