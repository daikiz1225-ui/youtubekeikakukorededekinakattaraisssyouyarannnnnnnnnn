<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Portal Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div id="sidebar-nav"></div>
        </aside>
        
        <main id="main-content">
            <div class="top-bar">
                <button id="theme-toggle" onclick="Actions.toggleTheme()">🌓 モード切替</button>
                <input type="text" id="search-input" placeholder="検索ワードを入力...">
            </div>
            
            <div id="view-container"></div>
            
            <div id="pagination">
                <button id="load-more" onclick="Actions.loadMore()">さらに読み込む</button>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
