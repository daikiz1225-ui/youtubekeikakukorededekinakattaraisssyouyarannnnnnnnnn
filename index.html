<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script>
        (function() {
            // クッキーから指定の値を読み取る関数
            const getCookie = (name) => {
                const value = "; " + document.cookie;
                const parts = value.split("; " + name + "=");
                if (parts.length === 2) return parts.pop().split(";").shift();
            };

            const token = getCookie("access_token");
            const isAuthorized = sessionStorage.getItem('site_verified') === 'true';

            if (token === "valid_user") {
                // 正規のGASから来た証拠（クッキー）を確認
                sessionStorage.setItem('site_verified', 'true');
                // 使い終わったクッキーは即座に削除（悪用防止）
                document.cookie = "access_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            } else if (!isAuthorized) {
                // クッキーもなく、合格記録もないなら追放
                window.location.replace("https://www.google.com");
            }
        })();
    </script>

    <link id="favicon" rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onpopstate="location.reload()">

            <div class="logo" onclick="Actions.goHome()">
                <span class="logo-red">▶</span> Premium
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <script src="music.js"></script>

    <script src="app.js"></script>
    <script src="playlist.js"></script>
</body>
</html>
