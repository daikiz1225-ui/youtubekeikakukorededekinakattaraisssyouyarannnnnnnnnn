<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick Tube</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="search-box">
            <form id="search-form" onsubmit="event.preventDefault(); window.fetchVideos();">
                <input type="text" id="search-input" placeholder="動画を検索..." autocomplete="off">
                <button type="button" onclick="window.fetchVideos()">検索</button>
            </form>
        </div>
    </header>

    <main>
        <section id="view-home">
            <div id="search-results" class="video-grid">
                <p style="text-align:center; color:#aaa; margin-top:50px;">見たい動画を検索してください</p>
            </div>
        </section>

        <section id="view-player" style="display:none;">
            <button onclick="location.reload()" style="margin-bottom:10px; padding:10px; background:#333; color:white; border:none; border-radius:5px;">← 戻る</button>
            <div id="player-container" style="width:100%; aspect-ratio:16/9; background:#000;"></div>
            <div class="video-info" style="padding:15px; color:white;">
                <h1 id="current-video-title" style="font-size:18px;"></h1>
                <p id="current-channel-name" style="color:#aaa;"></p>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    
    <script src="js/search-engine.js"></script>
    <script src="js/thumbnail-list.js"></script>
    <script src="js/player.js"></script>
    
    <script src="js/main.js"></script>

</body>
</html>
