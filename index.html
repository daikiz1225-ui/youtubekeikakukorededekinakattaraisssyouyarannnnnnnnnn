<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edu-Kahoot Portal</title>
    <style>
        body { background: #46178f; color: #fff; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        header { background: #330e6b; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .search-box { display: flex; max-width: 600px; margin: 0 auto; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; font-size: 16px; outline: none; }
        button { background: #26890c; color: #fff; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #fff; color: #333; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card h3 { font-size: 14px; margin: 10px; height: 3em; overflow: hidden; }
        
        /* プレイヤー画面 */
        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 1100; background: #eb1041; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="home-view">
    <header><h1>Kahoot! 学習ビデオ検索</h1></header>
    <div class="search-box" style="margin-top: 20px;">
        <input type="text" id="q" placeholder="学習キーワードを入力...">
        <button onclick="search()">検索</button>
    </div>
    <div id="results" class="grid"></div>
</div>

<div id="player-view">
    <button class="back-btn" onclick="closePlayer()">戻る</button>
    <div id="video-wrapper" style="width: 100%; height: 100%;"></div>
</div>

<script>
const KEY = "AIzaSyBbqPhAbqoWDOurTt7hejQmwc6dAoZ5Iy0";
// 💡 Kahoot!から盗み出した魔法のキー（encデータ）
const ENC = "AXH1ezm-TdFofe0cZEIyT5D-ZlyaXT8az20UGmK_8TRbbl7-MJkqQiDn89vv-Kx83auqjnc7WreI4HeppaSKfC0XpFV0BvqF3llcrWUQtfrIeuuX8ALKwU5iNjS56Z545ilryvxnkk2BGKeZvaLB6tiu1GwH4Npdfw%3D%3D";

async function search() {
    const q = document.getElementById('q').value;
    if(!q) return;
    const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=24&key=${KEY}`);
    const data = await res.json();
    const container = document.getElementById('results');
    container.innerHTML = '';
    
    data.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => play(item.id.videoId);
        card.innerHTML = `<img src="${item.snippet.thumbnails.high.url}"><h3>${item.snippet.title}</h3>`;
        container.appendChild(card);
    });
}

function play(id) {
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('player-view').style.display = 'block';
    
    // 💡 Kahoot!の通信を完璧にコピーしたURL
    // これでi-FILTERは「Kahoot!の授業中だな」と勘違いする
    const kahootFakeUrl = `https://www.youtubeeducation.com/embed/${id}?autoplay=1&origin=https%3A%2F%2Fcreate.kahoot.it&enablejsapi=1&embed_config=%7B%22enc%22%3A%22${ENC}%22%2C%22hideTitle%22%3Atrue%7D`;

    document.getElementById('video-wrapper').innerHTML = `
        <iframe src="${kahootFakeUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>
    `;
}

function closePlayer() {
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('player-view').style.display = 'none';
    document.getElementById('video-wrapper').innerHTML = '';
}
</script>
</body>
</html>
