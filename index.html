<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checking...</title>
    <link rel="stylesheet" href="style.css">

    <script src="allowlist.js"></script>

    <script>
    (function() {
        // デバイスの「DNA」をIndexedDBに保存・取得
        async function getPersistentDNA() {
            return new Promise((resolve) => {
                const req = indexedDB.open("SystemAuthDB", 1);
                req.onupgradeneeded = (e) => e.target.result.createObjectStore("auth");
                req.onsuccess = (e) => {
                    const db = e.target.result;
                    const tx = db.transaction("auth", "readwrite");
                    const store = tx.objectStore("auth");
                    const getReq = store.get("device_dna");
                    getReq.onsuccess = () => {
                        if (getReq.result) {
                            resolve(getReq.result);
                        } else {
                            const newDNA = 'DNA-' + crypto.randomUUID().split('-')[0].toUpperCase();
                            store.put(newDNA, "device_dna");
                            resolve(newDNA);
                        }
                    };
                };
            });
        }

        async function applySecureGuard() {
            const dna = await getPersistentDNA();
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const renderer = gl ? gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL) : "unknown";
            
            const rawSource = dna + renderer + screen.width + "SECURE_v4";
            
            let hash = 0;
            for (let i = 0; i < rawSource.length; i++) {
                hash = ((hash << 5) - hash) + rawSource.charCodeAt(i);
                hash |= 0;
            }
            const finalID = "ID-" + Math.abs(hash).toString(36).toUpperCase();

            // 承認チェック
            if (typeof ALLOWED_IDS !== 'undefined' && ALLOWED_IDS.includes(finalID)) {
                document.title = "YouTube Premium Client";
            } else {
                // 【修正箇所】 \ を削除して変数が表示されるようにしました
                document.documentElement.innerHTML = `
                    <style>
                        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
                        .card { border: 2px solid #222; padding: 40px; border-radius: 25px; background: #050505; width: 85%; max-width: 450px; }
                        .id-text { font-size: 38px; color: #00ff00; font-family: monospace; margin: 25px 0; display: block; letter-spacing: 2px; border: 1px dashed #333; padding: 10px; }
                        button { background: #0055ff; color: #fff; border: none; padding: 18px 40px; border-radius: 40px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; }
                    </style>
                    <div class="card">
                        <h2 style="color:#ff4e45; margin-top:0;">端末未承認</h2>
                        <p style="color:#888;">このiPadの固有IDを発行しました。<br>コピーして開発者に送ってください。</p>
                        <span class="id-text">${finalID}</span>
                        <button onclick="navigator.clipboard.writeText('${finalID}');alert('コピーしました！')">IDをコピー</button>
                        <p style="margin-top:25px; font-size:12px; color:#444;">※履歴を消しても基本的には維持されます。</p>
                    </div>
                `;
                window.stop();
            }
        }
        applySecureGuard();
    })();
    </script>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="Actions.goHome()">
            <span class="logo-red">▶</span> Premium
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <div class="nav-item" onclick="Actions.showGame()" style="color: #4CAF50; font-weight: bold;">🎮<span>ゲーム</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
