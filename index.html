<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick Tube</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .search-box { padding: 20px; background: #222; display: flex; gap: 10px; position: sticky; top: 0; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
        button { padding: 12px 20px; background: #f00; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .video-card { cursor: pointer; background: #222; border-radius: 12px; overflow: hidden; padding-bottom: 10px;}
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-card h3 { font-size: 13px; margin: 8px; }
        #view-player { display: none; padding: 20px; }
    </style>
</head>
<body>

    <div id="view-home">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="動画を検索..." onkeypress="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()">検索</button>
        </div>
        <div id="search-results" class="video-grid"></div>
    </div>

    <div id="view-player">
        <button onclick="location.reload()" style="background:#333; color:white; padding:10px; border:none; border-radius:5px; margin-bottom:15px;">← 戻る</button>
        <div id="player-container" style="width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;"></div>
        <h1 id="player-title" style="font-size:18px; margin-top:15px;"></h1>
    </div>

    <script>
        // 🚨 修正ポイント：ここにあなたのAPIキーを直接貼り付けてください
        const API_KEY = "ここにAPIキーを貼る"; 
        const EDU_ID = "o-hmiN9tvUUI2EQM";

        async function doSearch() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const results = document.getElementById('search-results');
            results.innerHTML = '<p>検索中...</p>';

            // 💡 ここの ${API_KEY} が確実に上の変数と繋がっているぜ
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) {
                    // APIが「キーがない」と言ってきたらここに表示される
                    results.innerHTML = `<p style="color:red;">APIエラー: ${data.error.message}</p>`;
                    return;
                }

                results.innerHTML = '';
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => {
                        document.getElementById('view-home').style.display = 'none';
                        document.getElementById('view-player').style.display = 'block';
                        document.getElementById('player-title').innerText = item.snippet.title;
                        
                        const embedUrl = `https://www.youtubeeducation.com/embed/${item.id.videoId}?edufilter=${EDU_ID}&rel=0&autoplay=1`;
                        document.getElementById('player-container').innerHTML = `
                            <iframe src="${embedUrl}" frameborder="0" style="width:100%; height:100%;" allowfullscreen allow="autoplay"></iframe>
                        `;
                    };
                    card.innerHTML = `<img src="${item.snippet.thumbnails.high.url}"><h3>${item.snippet.title}</h3>`;
                    results.appendChild(card);
                });
            } catch (e) {
                results.innerHTML = '<p>エラーが発生しました</p>';
            }
        }
    </script>
</body>
</html>
