<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Education</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" onclick="Router.goHome(true)"><span>▶</span> YouTube</div>
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="検索" onkeypress="if(event.key==='Enter') Actions.search()">
                <button class="search-btn" onclick="Actions.search()">🔍</button>
            </div>
        </div>
    </header>

    <div class="main-wrapper">
        <aside>
            <nav>
                <div class="nav-item" onclick="Router.goHome()">🏠 ホーム</div>
                <div class="nav-item" onclick="Actions.setMode('shorts')">🎞️ ショート</div>
                <div class="nav-item" onclick="Actions.showSubs()">📺 登録チャンネル</div>
                <div class="nav-sep"></div>
                <div class="nav-item" onclick="Actions.showHistory()">🕒 履歴</div>
            </nav>
            <div id="sub-sidebar-list" class="sub-list"></div>
        </aside>

        <main id="main-content">
            <div id="view-container"></div>
            <button id="load-more" class="hidden" onclick="Actions.loadMore()">さらに読み込む</button>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="youtube.js"></script>
    <script src="app.js"></script>
</body>
</html>
