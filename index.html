<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Education Pro</title>
    <style>
        :root { --bg-color: #0f0f0f; --text-color: #ffffff; --hover-color: #272727; --yt-red: #ff0000; }
        body { background: var(--bg-color); color: var(--text-color); font-family: "Roboto", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { display: flex; align-items: center; padding: 10px 20px; height: 56px; sticky; top: 0; z-index: 2000; background: var(--bg-color); }
        .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; min-width: 120px; }
        .logo span { color: var(--yt-red); font-size: 24px; }
        .search-area { flex: 1; display: flex; justify-content: center; }
        .search-box { display: flex; width: 100%; max-width: 600px; background: #121212; border: 1px solid #333; border-radius: 40px; }
        input { background: transparent; border: none; color: #fff; padding: 10px 20px; flex: 1; outline: none; }
        .search-btn { background: #222; border: none; padding: 0 20px; color: #fff; border-radius: 0 40px 40px 0; border-left: 1px solid #333; cursor: pointer; }

        /* Main Layout */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 240px; padding: 12px; background: var(--bg-color); overflow-y: auto; }
        .nav-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 20px; font-size: 14px; }
        .nav-item:hover { background: var(--hover-color); }
        .nav-sep { height: 1px; background: #333; margin: 12px 0; }

        /* Content Area */
        main { flex: 1; overflow-y: auto; padding: 20px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .v-card h3 { font-size: 16px; margin: 10px 0 5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-meta { color: #aaa; font-size: 12px; }

        /* Load More Button */
        .load-more { display: block; width: 200px; margin: 30px auto; padding: 10px; background: var(--hover-color); border: none; color: #fff; border-radius: 20px; cursor: pointer; text-align: center; }
        .load-more:hover { background: #3f3f3f; }

        /* Watch Page Override */
        #watch-view { display: none; width: 100%; height: 100%; }
        .watch-container { display: flex; gap: 24px; padding: 20px; max-width: 1700px; margin: 0 auto; }
        .player-main { flex: 3; }
        .sidebar-list { flex: 1; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome(true)"><span>▶</span> YouTube</div>
    <div class="search-area">
        <div class="search-box">
            <input type="text" id="q" placeholder="検索" onkeypress="if(event.key==='Enter') startSearch()">
            <button class="search-btn" onclick="startSearch()">🔍</button>
        </div>
    </div>
</header>

<div class="main-wrapper">
    <aside id="sidebar">
        <div class="nav-item" onclick="goHome(false)">🏠 ホーム</div>
        <div class="nav-item">🎞️ ショート</div>
        <div class="nav-item">📺 登録チャンネル</div>
        <div class="nav-sep"></div>
        <div class="nav-item" onclick="showHistory()">🕒 履歴</div>
        <div class="nav-item">⭐ お気に入り</div>
        <div class="nav-item">📁 再生リスト</div>
    </aside>

    <main id="main-scroll">
        <div id="home-view">
            <div id="results" class="video-grid"></div>
            <button id="load-more-btn" class="load-more" style="display:none;" onclick="startSearch(true)">さらに読み込む</button>
        </div>

        <div id="watch-view">
            <div class="watch-container">
                <div class="player-main">
                    <div class="player-box" id="player-container"></div>
                    <h2 id="v-title" style="margin-top:15px; font-size:20px;"></h2>
                    <div id="v-channel" style="color:#aaa;"></div>
                </div>
                <div class="sidebar-list" id="related-list"></div>
            </div>
        </div>
    </main>
</div>

<script>
const KEY = "AIzaSyBbqPhAbqoWDOurTt7hejQmwc6dAoZ5Iy0";
const ENC = "AXH1ezm-TdFofe0cZEIyT5D-ZlyaXT8az20UGmK_8TRbbl7-MJkqQiDn89vv-Kx83auqjnc7WreI4HeppaSKfC0XpFV0BvqF3llcrWUQtfrIeuuX8ALKwU5iNjS56Z545ilryvxnkk2BGKeZvaLB6tiu1GwH4Npdfw%3D%3D";

let currentQuery = "";
let nextToken = "";
let searchCache = {}; // 検索ワードをキーにしてデータを保存
let videoHistory = []; // 再生履歴

// 検索開始
async function startSearch(isMore = false) {
    const q = document.getElementById('q').value;
    if(!q) return;

    // ホーム表示に切り替え
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('watch-view').style.display = 'none';

    // 同じワードで追加読み込みじゃない場合はキャッシュチェック
    if(!isMore && searchCache[q]) {
        currentQuery = q;
        renderHome(searchCache[q].items, false);
        return;
    }

    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=20&key=${KEY}${isMore ? `&pageToken=${nextToken}` : ''}`;
    
    try {
        const res = await fetch(url);
        const data = await res.json();
        nextToken = data.nextPageToken || "";
        
        if(!isMore) {
            searchCache[q] = data; // キャッシュに保存
            renderHome(data.items, false);
        } else {
            searchCache[q].items.push(...data.items);
            renderHome(data.items, true);
        }
        
        document.getElementById('load-more-btn').style.display = nextToken ? 'block' : 'none';
        currentQuery = q;
    } catch(e) { alert("API制限かも！"); }
}

function renderHome(items, isAppend) {
    const container = document.getElementById('results');
    const html = items.map(item => `
        <div class="v-card" onclick="playVideo('${item.id.videoId}', '${item.snippet.title.replace(/'/g,"")}', '${item.snippet.channelTitle}')">
            <img src="${item.snippet.thumbnails.high.url}">
            <div class="details">
                <h3>${item.snippet.title}</h3>
                <div class="v-meta">${item.snippet.channelTitle}</div>
            </div>
        </div>
    `).join('');
    
    if(isAppend) container.innerHTML += html;
    else container.innerHTML = html;
}

function playVideo(id, title, channel) {
    // 履歴に追加
    if(!videoHistory.find(v => v.id === id)) {
        videoHistory.unshift({id, title, channel});
    }

    document.getElementById('home-view').style.display = 'none';
    document.getElementById('watch-view').style.display = 'block';
    document.getElementById('v-title').innerText = title;
    document.getElementById('v-channel').innerText = channel;

    const url = `https://www.youtubeeducation.com/embed/${id}?autoplay=1&origin=https%3A%2F%2Fcreate.kahoot.it&enablejsapi=1&embed_config=%7B%22enc%22%3A%22${ENC}%22%2C%22hideTitle%22%3Atrue%7D`;
    document.getElementById('player-container').innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

function showHistory() {
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('watch-view').style.display = 'none';
    document.getElementById('load-more-btn').style.display = 'none';
    const container = document.getElementById('results');
    
    if(videoHistory.length === 0) {
        container.innerHTML = "<p>履歴はありません</p>";
        return;
    }
    
    container.innerHTML = videoHistory.map(v => `
        <div class="v-card" onclick="playVideo('${v.id}', '${v.title}', '${v.channel}')">
            <div style="background:#333; aspect-ratio:16/9; border-radius:12px; display:flex; align-items:center; justify-content:center;">再生済み</div>
            <div class="details"><h3>${v.title}</h3><div class="v-meta">${v.channel}</div></div>
        </div>
    `).join('');
}

function goHome(clearSearch) {
    if(clearSearch) {
        document.getElementById('q').value = "";
        document.getElementById('results').innerHTML = "";
        document.getElementById('load-more-btn').style.display = 'none';
        currentQuery = "";
    }
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('watch-view').style.display = 'none';
    document.getElementById('player-container').innerHTML = '';
}
</script>
</body>
</html>
