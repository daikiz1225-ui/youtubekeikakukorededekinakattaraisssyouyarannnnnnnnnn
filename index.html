<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Portal Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome(true)">🏠 <span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShortsFeed()">⚡ <span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">🔔 <span>登録チャンネル</span></div>
            <div class="nav-item" onclick="Actions.showHistory()">🕒 <span>履歴</span></div>
        </nav>
        <main id="main-content">
            <header class="top-bar">
                <input type="text" id="search-input" placeholder="動画を検索..." onkeydown="if(event.key==='Enter') Actions.search()">
                <button onclick="Actions.search()" class="search-btn">検索</button>
            </header>
            <div id="view-container"></div>
            <div id="pagination" style="text-align:center; padding: 20px;">
                <button id="load-more" onclick="Actions.loadMore()" style="display:none;">さらに読み込む</button>
            </div>
        </main>
    </div>
    <script src="youtube.js"></script>
    <script src="app.js"></script>
</body>
</html>
