<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Portal Pro v3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar-nav"></nav>
        
        <main id="main-content">
            <header class="top-bar">
                <input type="text" id="search-input" placeholder="動画を検索..." onkeydown="if(event.key==='Enter') Actions.search()">
                <div class="top-btns" style="display:flex; gap:10px;">
                    <button onclick="Actions.search()" class="btn">検索</button>
                    <button onclick="Theme.toggle()" id="theme-toggle-btn" class="btn">🌙</button>
                </div>
            </header>
            <div id="view-container"></div>
            <div id="pagination" style="text-align:center; padding: 20px;">
                <button id="load-more" onclick="Actions.loadMore()" style="display:none;">さらに読み込む</button>
            </div>
        </main>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="youtube.js"></script>
    <script src="app.js"></script>
</body>
</html>
