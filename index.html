<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Client Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <div id="theme-toggle-btn">🌓</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="検索..." autocomplete="off">
            <button id="search-btn">🔍</button>
        </div>
    </header>

    <div id="view-container"></div>

    <nav id="sidebar">
        <div id="sidebar-nav">
            </div>
    </nav>

    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div id="playlist-modal" style="background:var(--bg-color); padding:20px; border-radius:12px; border:1px solid var(--border-color); width:90%; max-width:400px;">
            <h3 id="modal-title">プレイリストに追加</h3>
            <div id="playlist-selector" style="max-height:200px; overflow-y:auto; margin:15px 0;"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="new-playlist-name" placeholder="新しいリスト名" style="flex:1; padding:8px; border-radius:4px; border:1px solid var(--border-color); background:var(--input-bg); color:inherit;">
                <button class="btn" onclick="Actions.createNewPlaylist()">作成</button>
            </div>
            <button class="btn" onclick="Actions.closeModal()" style="width:100%; margin-top:15px; background:#555;">閉じる</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
