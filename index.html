<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Device Authorization</title>
    <link rel="stylesheet" href="style.css">

    <script src="allowlist.js"></script>

    <script>
    (function() {
        // デバイス固有IDの生成（履歴・Wi-Fi・劣化に強い）
        async function getSecureID() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
            
            const specs = [
                navigator.userAgent,
                screen.width + "x" + screen.height,
                navigator.hardwareConcurrency,
                renderer,
                "YT_PREMIUM_SECURE_v3" // ソルト
            ].join('|');

            let hash = 0;
            for (let i = 0; i < specs.length; i++) {
                hash = ((hash << 5) - hash) + specs.charCodeAt(i);
                hash |= 0;
            }
            return "DEV-" + Math.abs(hash).toString(36).toUpperCase();
        }

        async function applyGuard() {
            const currentID = await getSecureID();
            
            // 許可リストにIDがあるかチェック
            const isAllowed = (typeof ALLOWED_IDS !== 'undefined' && ALLOWED_IDS.includes(currentID));

            if (isAllowed) {
                // 承認済み：そのままサイトを表示
                document.title = "YouTube Premium Client";
                console.log("Authorized.");
            } else {
                // 未承認：承認待ち専用画面を表示
                document.documentElement.innerHTML = `
                    <style>
                        body { 
                            background: #0f0f0f; color: #fff; font-family: sans-serif; 
                            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
                        }
                        .container { text-align: center; padding: 20px; width: 90%; max-width: 500px; }
                        h1 { color: #ff4e45; font-size: 28px; margin-bottom: 10px; }
                        .id-card { 
                            background: #1e1e1e; padding: 30px; border-radius: 20px; 
                            border: 2px solid #333; margin: 25px 0; 
                        }
                        .id-label { color: #888; font-size: 14px; margin-bottom: 10px; }
                        .id-value { 
                            color: #00ff00; font-size: 32px; font-family: monospace; 
                            word-break: break-all; letter-spacing: 2px;
                        }
                        .copy-btn { 
                            background: #0055ff; color: white; border: none; padding: 18px 40px; 
                            border-radius: 35px; font-size: 18px; font-weight: bold; cursor: pointer;
                            box-shadow: 0 5px 15px rgba(0,85,255,0.3); width: 100%;
                        }
                        .msg { color: #aaa; line-height: 1.6; margin-top: 20px; }
                    </style>
                    <div class="container">
                        <h1>承認が必要です</h1>
                        <p class="msg">この端末はまだ登録されていません。<br>以下のIDをコピーして開発者に送ってください。</p>
                        
                        <div class="id-card">
                            <div class="id-label">あなたの許可ID</div>
                            <div class="id-value">${currentID}</div>
                        </div>

                        <button class="copy-btn" onclick="copyID('${currentID}')">IDをコピーする</button>
                        
                        <p style="margin-top:40px; font-size:12px; color:#444;">IDを送った後、開発者が追加すると利用可能になります。</p>
                    </div>

                    <script>
                        function copyID(id) {
                            navigator.clipboard.writeText(id).then(() => {
                                alert("IDをコピーしました！Teams等で送ってください。");
                            }).catch(() => {
                                alert("コピーに失敗しました。直接メモしてください: " + id);
                            });
                        }
                    <\/script>
                `;
                window.stop();
            }
        }
        applyGuard();
    })();
    </script>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="Actions.goHome()">
            <span class="logo-red">▶</span> Premium
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <div class="nav-item" onclick="Actions.showGame()" style="color: #4CAF50; font-weight: bold;">🎮<span>ゲーム</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
