<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #111; color: white; transition: background-color 0.2s;">

    <aside id="sidebar">
        <div class="logo">kick tube</div>
        <nav id="channel-list"></nav>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <form id="search-form" onsubmit="return false;" class="search-container" style="display:flex; gap:10px; padding:10px;">
                <input type="text" id="search-input" placeholder="動画を検索..." style="flex:1; padding:10px; border-radius:5px; border:none;">
                <button id="search-button" type="submit" style="padding:10px 20px; background:red; color:white; border:none; border-radius:5px; font-weight:bold;">検索</button>
            </form>
        </header>

        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">検索ワードを入れてね</div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div id="player-container"></div>
            <div id="video-controls" style="text-align:center; padding:20px;">
                <button id="back-to-home" class="btn">⬅️ 戻る</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/config.js?v=5.0"></script>
    <script type="module" src="js/ui-switcher.js?v=5.0"></script>
    <script type="module" src="js/search-engine.js?v=5.0"></script>
    <script type="module" src="js/thumbnail-list.js?v=5.0"></script>
    <script type="module" src="js/player.js?v=5.0"></script>
    <script type="module" src="js/main.js?v=5.0"></script>

</body>
</html>
