<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Portal Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar-nav"></nav>
        
        <main id="main-content">
            <header class="top-bar">
                <input type="text" id="search-input" placeholder="動画を検索..." onkeydown="if(event.key==='Enter') Actions.search()">
                <button onclick="Actions.search()" class="search-btn">検索</button>
            </header>
            <div id="view-container"></div>
            <div id="pagination" style="text-align:center; padding: 20px;">
                <button id="load-more" onclick="Actions.loadMore()" style="display:none; background:#333; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;">さらに読み込む</button>
            </div>
        </main>
    </div>
    <script src="youtube.js"></script>
    <script src="app.js"></script>
</body>
</html>
