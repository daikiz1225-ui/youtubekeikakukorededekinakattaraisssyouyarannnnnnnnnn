            if (currentMode === 'shutdown') {

                window.location.replace(window.location.origin + window.location.pathname);
                return;
            }

            // 未認証時のドキュメント生成
            if (localStorage.getItem(LOCK_KEY) !== 'true') {
                document.write(`
                    <title>Python 3.12 実行環境における高度なメモリ管理とセキュリティ・プロトコル - TechDocs Enterprise</title>
                    <style>

                    </style>
                    <div class="c">
                        <h1>Python 3.12 実行環境における高度なメモリ管理とセキュリティ・プロトコル</h1>
                        <p>本テクニカル・リファレンスでは、Python 3.12（CPython実装）における内部メモリ管理、参照カウント、世代別ガベージコレクション（GC）、およびマルチスレッド環境におけるGIL（グローバルインタプリタロック）の挙動について解説します。</p>
                        
                        <div class="w">
                            <strong>セキュリティ警告:</strong> 現在、リモート・インタープリタのアクセス権限が制限されています。実行ガバナンス・プロトコルを有効化するには、指定された認証パラメータをURLに付与して再読み込みを行ってください。
                        </div>

                        <h2>1. オブジェクトのアロケーションとPyObject構造体</h2>
                        <p>Pythonのすべてのオブジェクトは、C言語レイヤーにおける <code>PyObject</code> または <code>PyVarObject</code> 構造体の拡張です。これらはメタデータとして、参照カウント（<code>ob_refcnt</code>）および型オブジェクトへのポインタ（<code>ob_type</code>）を保持します。</p>
                        <pre><code>typedef struct _object {
    _PyObject_HEAD_EXTRA // 双方向リンクストリーム（デバッグビルド時）
    Py_ssize_t ob_refcnt;
    struct _typeobject *ob_type;
} PyObject;</code></pre>

                        <h2>2. PyMallocによる小規模オブジェクトの最適化</h2>
                        <p>512バイト以下の小規模なメモリ割り当てに対して、Pythonは標準の <code>malloc</code> をバイパスし、独自のシステムである <b>PyMalloc</b> を使用します。これにより、OSカーネルのシステムコール負荷を軽減し、メモリの断片化（フラグメンテーション）を防ぎます。</p>
                        <ul>
                            <li><b>Arena (256KB):</b> メモリ割り当ての最大単位。OSから直接確保されます。</li>
                            <li><b>Pool (4KB):</b> Arenaの内部を4KBごとに分割した管理単位。同一サイズクラスのオブジェクトを格納します。</li>
                            <li><b>Block:</b> 実際にオブジェクトが配置されるメモリチャンク。8バイト単位でアラインメントされます。</li>
                        </ul>

                        <h2>3. 世代別ガベージコレクション（GC）</h2>
                        <p>参照カウント方式では解決できない「循環参照（セルフ・リファレンス）」を検知・解放するため、Pythonは補助的な世代別GCアルゴリズムを採用しています。オブジェクトは生存期間に応じて第0世代、第1世代、第2世代へと昇格し、若い世代ほど頻繁にスキャンを受けます。</p>
                    </div>
                `);
                document.close();
                throw new Error("ACCESS_DENIED_GAURD_ACTIVE");
