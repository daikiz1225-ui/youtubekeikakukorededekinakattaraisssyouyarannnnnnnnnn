<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Client Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <div id="theme-toggle-btn">🌓</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="キーワードを入力..." autocomplete="off">
            <button id="search-btn">🔍</button>
        </div>
    </header>

    <nav id="sidebar">
        <div id="sidebar-nav">
            <div class="nav-item" onclick="Actions.goHome()">
                <div class="nav-icon">🏠</div>
                <span>ホーム</span>
            </div>
            <div class="nav-item" onclick="Actions.showShorts()">
                <div class="nav-icon">⚡</div>
                <span>ショート</span>
            </div>
            <div class="nav-item" onclick="Actions.showLikes()">
                <div class="nav-icon">👍</div>
                <span>いいね</span>
            </div>
            <div class="nav-item" onclick="Actions.showPlaylists()">
                <div class="nav-icon">📁</div>
                <span>リスト</span>
            </div>
            <div class="nav-item" onclick="Actions.showSubs()">
                <div class="nav-icon">🔔</div>
                <span>登録中</span>
            </div>
            <div class="nav-item" onclick="Actions.showHistory()">
                <div class="nav-icon">🕒</div>
                <span>履歴</span>
            </div>
        </div>
    </nav>

    <main id="view-container"></main>

    <div id="modal-overlay" style="display:none;" onclick="Actions.closeModalOutside(event)">
        <div id="playlist-modal">
            <div class="modal-header">
                <h3>プレイリストに追加</h3>
                <span class="close-x" onclick="Actions.closeModal()">×</span>
            </div>
            <div id="playlist-selector"></div>
            <div class="modal-footer">
                <div class="modal-input-group">
                    <input type="text" id="new-playlist-name" placeholder="新しいリストの名前...">
                    <button type="button" class="btn primary-btn" id="create-playlist-btn">作成</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
