<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
   <link id="favicon" rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <title>googlo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 追加分の簡易スタイル */
        #opinion-modal textarea::placeholder { color: #666; }
        .admin-log-item { border-bottom: 1px solid #333; padding: 5px 0; margin-bottom: 5px; }
        .admin-log-item b { color: #3ea6ff; display: block; margin-bottom: 2px; }
    </style>
</head>
<body onpopstate="location.reload()">
    <header class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="back-btn" onclick="Actions.goBack()" style="cursor: pointer; font-size: 20px; padding: 5px; display: none;">🔄</div>
            <div class="logo" onclick="Actions.goHome()">
                <span class="logo-red">▶</span> Premium
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>

            <div id="admin-panel" style="display:none; padding:10px; font-size:11px; background:#1a1a1a; margin:10px 5px; border-radius:8px; border:1px solid #3ea6ff;">
                <h4 style="margin:0 0 8px 0; color:#3ea6ff; display:flex; align-items:center; gap:5px;">📊 管理者統計</h4>
                <div id="api-stats-view" style="max-height:200px; overflow-y:auto; color:#ccc;">読み込み中...</div>
            </div>

            <div class="nav-item" onclick="OpinionHandler.openModal()" style="color:#00ff00; margin-top: 10px;">
                ✉️<span>ご意見板</span>
            </div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <div id="opinion-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e1e1e; border:1px solid #333; padding:20px; z-index:10000; border-radius:12px; width:90%; max-width:320px; color:white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h3 style="margin:0 0 10px 0; font-size:18px;">ご意見フォーム</h3>
        <p style="font-size:11px; color:#888; margin-bottom:10px;">改善案やバグ報告をお送りください。</p>
        <textarea id="opinion-input" style="width:100%; height:100px; background:#000; color:#fff; border:1px solid #444; border-radius:6px; padding:10px; box-sizing:border-box; outline:none; font-size:14px;" placeholder="メッセージを入力..."></textarea>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:15px;">
            <button onclick="OpinionHandler.closeModal()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:14px;">キャンセル</button>
            <button onclick="OpinionHandler.send()" style="background:#3ea6ff; border:none; color:white; padding:8px 20px; border-radius:6px; cursor:pointer; font-weight:bold;">送信</button>
        </div>
    </div>

    <script src="music.js"></script>
    <script src="game.js"></script>
    <script src="tetris.js"></script>
    <script src="snake.js"></script>
    <script src="reversi.js"></script>
    <script src="shogi.js"></script>
    <script src="blockblast.js"></script>
    <script src="game2048.js"></script>
    <script src="towerdefense.js"></script>
    <script src="airhockey.js"></script>
    <script src="streaming.js"></script>
    <script src="search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="api/m3u8.js"></script>
    <script src="app.js"></script>
    <script src="playlist.js"></script>
    <script src="opinion.js"></script>
</body>
</html>
