<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Yahoo!ニュース - 映像配信サービス</title>
    <style>
        /* Yahoo!ニュースっぽい配色とデザインに偽装 */
        body { background: #f2f2f2; color: #333; font-family: "MS PGothic", sans-serif; margin: 0; }
        header { background: #fff; border-bottom: 2px solid #ff0000; padding: 10px; display: flex; align-items: center; }
        .logo { font-weight: bold; font-size: 20px; color: #000; text-decoration: none; }
        .search-container { background: #fff; padding: 15px; margin: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        
        /* 動画カード */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 15px; }
        .video-card { background: #fff; border: 1px solid #ddd; cursor: pointer; font-size: 12px; }
        .video-card img { width: 100%; }
        .video-card h3 { margin: 5px; height: 3em; overflow: hidden; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Yahoo!ニュース</a>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="キーワードを入力してください">
        <button class="btn" onclick="doSearch()">検索</button>
    </div>

    <div id="search-results" class="video-grid"></div>

    <script>
        const API_KEY = "AIzaSyBbqPhAbqoWDOurTt7hejQmwc6dAoZ5Iy0";

        async function doSearch() {
            const query = document.getElementById('search-input').value;
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${API_KEY}`);
            const data = await res.json();
            const results = document.getElementById('search-results');
            results.innerHTML = '';
            
            data.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => {
                    // ✅ Yahoo! ニュースの動画ページを経由しているように偽装してダウンローダーへ
                    const targetUrl = `https://www.ssyoutube.com/watch?v=${item.id.videoId}`;
                    
                    // 新しいウィンドウを開く際、リファラ情報を操作（ブラウザに依存するが）
                    const win = window.open('', '_blank');
                    win.opener = null;
                    win.location.href = targetUrl;
                };
                card.innerHTML = `<img src="${item.snippet.thumbnails.high.url}"><h3>${item.snippet.title}</h3>`;
                results.appendChild(card);
            });
        }
    </script>
</body>
</html>
