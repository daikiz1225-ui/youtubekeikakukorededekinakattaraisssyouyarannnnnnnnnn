<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ボタンとしての認識を強制するスタイル */
        #settings-trigger {
            appearance: none;
            -webkit-appearance: none;
            background: #333;
            border: none;
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: auto;
            display: block;
            outline: none;
        }
        #settings-trigger:active {
            background: #444; /* 押した時の反応 */
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="logo">kick tube</div>
        <nav id="channel-list"></nav>
        
        <button id="settings-trigger" type="button">
            ⚙️ 設定を開く
        </button>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="動画を検索..." autocomplete="off">
                <button id="search-button" type="button">検索</button>
            </div>
        </header>

        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">
                    設定からPipedドメインを入力してください
                </div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div id="player-container"></div>
            <div id="video-controls" style="padding:20px; text-align:center;">
                <button id="reload-video" class="btn">🔄 再読み込み</button>
                <button id="back-to-home" class="btn">⬅️ 戻る</button>
            </div>
        </section>
    </main>

    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>設定</h2>
            <div id="api-inputs"></div>
            <button id="save-settings-btn" class="btn-save" style="margin-top: 20px;">保存して閉じる</button>
        </div>
    </div>

    <script type="module" src="js/instance-manager.js?v=1.1"></script>
    <script type="module" src="js/ui-switcher.js?v=1.1"></script>
    <script type="module" src="js/search-engine.js?v=1.1"></script>
    <script type="module" src="js/thumbnail-list.js?v=1.1"></script>
    <script type="module" src="js/player.js?v=1.1"></script>
    <script type="module" src="js/settings.js?v=1.1"></script>
    <script type="module" src="js/main.js?v=1.1"></script>

</body> 
</html>
