<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube - Education Mode</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 全体のベース */
        body {
            background: #0f0f0f;
            color: white;
            font-family: "Roboto", Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* ヘッダー/検索バー */
        #search-header {
            padding: 10px 20px;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            height: 56px;
        }
        .search-container {
            display: flex;
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
            gap: 0;
        }
        #search-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 40px 0 0 40px;
            border: 1px solid #333;
            background: #121212;
            color: white;
            font-size: 16px;
        }
        #search-button {
            padding: 0 20px;
            background: #333;
            color: white;
            border: 1px solid #333;
            border-left: none;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* メインコンテンツ（動画一覧・プレイヤー） */
        #main-content {
            padding-top: 10px;
        }

        /* 動画グリッド（検索結果） */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        /* プレイヤー用レイアウト（横並び） */
        .player-layout {
            display: flex;
            flex-direction: row; /* 横並び */
            gap: 24px;
            padding: 20px;
            max-width: 1700px;
            margin: 0 auto;
        }

        /* 左側：メインプレイヤー */
        .player-main {
            flex: 3; /* 75%くらいの幅 */
        }

        /* 右側：関連動画 */
        .related-list {
            flex: 1; /* 25%くらいの幅 */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 埋め込みプレイヤー（16:9維持） */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 動画タイトル・アイコンエリア */
        .video-info-section {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            align-items: flex-start;
        }
        .channel-icon-large {
            width: 48px;
            height: 48px;
            background: #333; /* デフォルトの色 */
            border-radius: 50%;
            flex-shrink: 0;
        }
        .video-details {
            flex: 1;
        }
        .video-details h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            line-height: 1.4;
        }

        /* 戻るボタン */
        .btn-back {
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #272727;
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-back:hover {
            background: #3f3f3f;
        }

        /* iPad/スマホ向けの調整 */
        @media (max-width: 1000px) {
            .player-layout {
                flex-direction: column; /* 縦並びにする */
            }
            .player-main, .related-list {
                flex: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header id="search-header">
        <form id="search-form" onsubmit="return false;" class="search-container">
            <input type="text" id="search-input" placeholder="YouTubeを検索..." autocomplete="off">
            <button id="search-button" type="submit">検索</button>
        </form>
    </header>

    <main id="main-content">
        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #aaa;">
                    見たい動画を検索してね
                </div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div class="player-layout">
                <div class="player-main">
                    <button class="btn-back" onclick="location.reload()">⬅️ 検索に戻る</button>
                    
                    <div id="player-container">
                        </div>

                    <div class="video-info-section">
                        <div class="channel-icon-large" id="current-channel-icon"></div>
                        <div class="video-details">
                            <h2 id="current-video-title">動画タイトル</h2>
                            <p id="current-channel-name" style="color: #aaa; margin: 0;">チャンネル名</p>
                        </div>
                    </div>
                </div>

                <div class="related-list" id="related-videos">
                    <p style="color: #aaa;">関連動画</p>
                    </div>
            </div>
        </section>
    </main>

    <script src="js/config.js?v=10.0"></script>
    <script src="js/ui-switcher.js?v=10.0"></script>
    <script src="js/search-engine.js?v=10.0"></script>
    <script src="js/thumbnail-list.js?v=10.0"></script>
    <script src="js/player.js?v=10.0"></script>
    <script src="js/main.js?v=10.0"></script>

</body>
</html>
