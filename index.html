<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
   <link id="favicon" rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <title>GoogIe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onpopstate="location.reload()">
    <header class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="back-btn" onclick="Actions.goBack()" style="cursor: pointer; font-size: 20px; padding: 5px; display: none;">🔄</div>
            
            <div id="mainLogoBtn" class="logo" style="cursor: pointer; -webkit-tap-highlight-color: transparent;">
                <video id="logoVideo" muted playsinline style="width: 200px; height: auto; mix-blend-mode: screen; vertical-align: middle;">
                    <source src="YouTube.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-btn">🔍</button>
        </div>
        <div class="user-icons">
            <div class="icon-circle" onclick="Actions.showSubs()">🔔</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <div class="nav-item" onclick="Actions.goHome()">🏠<span>ホーム</span></div>
            <div class="nav-item" onclick="Actions.showShorts()">⚡<span>ショート</span></div>
            <div class="nav-item" onclick="Actions.showLiveHub()" style="color: #ff4e45; font-weight: bold;">🔴<span>Live</span></div>
            <div class="nav-item" onclick="Actions.showSubs()">👥<span>登録済み</span></div>
            <hr>
            <div class="nav-item" onclick="Actions.showHistory()">🕒<span>履歴</span></div>
        </nav>
        <main class="content" id="view-container"></main>
    </div>

    <script src="music.js"></script>
    <script src="game.js"></script>
    <script src="tetris.js"></script>
    <script src="snake.js"></script>
    <script src="reversi.js"></script>
    <script src="shogi.js"></script>
    <script src="blockblast.js"></script>
    <script src="game2048.js"></script>
    <script src="towerdefense.js"></script>
    <script src="airhockey.js"></script>
    <script src="streaming.js"></script>
    <script src="search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="api/m3u8.js"></script>
    <script src="app.js"></script>
    <script src="playlist.js"></script>
    <script src="backup.js"></script>

    <script>
        (function() {
            const logoBtn = document.getElementById('mainLogoBtn');
            const video = document.getElementById('logoVideo');

            if (!logoBtn || !video) return;

            // 1. ページ読み込み時に1回だけ光らせる
            video.addEventListener('canplaythrough', () => {
                video.play().catch(() => {});
            }, { once: true });

            // 2. クリック時の処理
            logoBtn.addEventListener('click', function(e) {
                // 動画を再生
                video.currentTime = 0;
                video.play();

                // 確実にホームへ戻る（Actions.goHomeが存在する場合）
                if (window.Actions && typeof Actions.goHome === 'function') {
                    Actions.goHome();
                }
            });
        })();
    </script>
</body>
</html>
