<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Edu</title>
    <style>
        :root { --bg-color: #0f0f0f; --text-color: #ffffff; --hover-color: #272727; --yt-red: #ff0000; }
        body { background: var(--bg-color); color: var(--text-color); font-family: "Roboto", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        header { display: flex; align-items: center; padding: 10px 20px; height: 56px; background: var(--bg-color); z-index: 2000; }
        .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; min-width: 120px; }
        .logo span { color: var(--yt-red); font-size: 24px; }
        .search-area { flex: 1; display: flex; justify-content: center; }
        .search-box { display: flex; width: 100%; max-width: 600px; background: #121212; border: 1px solid #333; border-radius: 40px; }
        input { background: transparent; border: none; color: #fff; padding: 10px 20px; flex: 1; outline: none; }
        .search-btn { background: #222; border: none; padding: 0 20px; color: #fff; border-radius: 0 40px 40px 0; border-left: 1px solid #333; cursor: pointer; }

        /* Main Layout */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        aside { width: 240px; padding: 12px; background: var(--bg-color); }
        .nav-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 20px; font-size: 14px; }
        .nav-item:hover { background: var(--hover-color); }
        .active { background: var(--hover-color); font-weight: bold; }

        /* Content Area */
        main { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .v-card h3 { font-size: 14px; margin: 10px 0 5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Watch Page (再生画面) */
        #watch-view { display: none; width: 100%; height: 100%; }
        .watch-container { display: flex; gap: 24px; padding: 10px; max-width: 1500px; margin: 0 auto; }
        .player-main { flex: 2.5; }
        .side-list { flex: 1; height: 90vh; overflow-y: auto; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* サイドバー動画カード */
        .s-card { display: flex; gap: 8px; margin-bottom: 12px; cursor: pointer; }
        .s-card img { width: 140px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; }
        .s-card h3 { font-size: 12px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome(true)"><span>▶</span> YouTube</div>
    <div class="search-area">
        <div class="search-box">
            <input type="text" id="q" placeholder="検索" onkeypress="if(event.key==='Enter') startSearch()">
            <button class="search-btn" onclick="startSearch()">🔍</button>
        </div>
    </div>
</header>

<div class="main-wrapper">
    <aside>
        <div class="nav-item active" id="menu-home" onclick="setMode('video')">🏠 ホーム</div>
        <div class="nav-item" id="menu-shorts" onclick="setMode('shorts')">🎞️ ショート</div>
        <div class="nav-sep" style="height:1px; background:#333; margin:10px 0;"></div>
        <div class="nav-item" onclick="showHistory()">🕒 履歴</div>
    </aside>

    <main id="content-pane">
        <div id="home-view">
            <div id="results" class="video-grid"></div>
            <button id="load-more" style="display:none; margin: 20px auto; padding: 10px 20px; cursor:pointer;" onclick="startSearch(true)">さらに読み込む</button>
        </div>

        <div id="watch-view">
            <div class="watch-container">
                <div class="player-main">
                    <div class="player-box" id="player-container"></div>
                    <h2 id="v-title" style="font-size:18px; margin:15px 0;"></h2>
                </div>
                <div class="side-list" id="side-results"></div>
            </div>
        </div>
    </main>
</div>

<script>
const KEY = "AIzaSyBbqPhAbqoWDOurTt7hejQmwc6dAoZ5Iy0";
const ENC = "AXH1ezm-TdFofe0cZEIyT5D-ZlyaXT8az20UGmK_8TRbbl7-MJkqQiDn89vv-Kx83auqjnc7WreI4HeppaSKfC0XpFV0BvqF3llcrWUQtfrIeuuX8ALKwU5iNjS56Z545ilryvxnkk2BGKeZvaLB6tiu1GwH4Npdfw%3D%3D";

let currentMode = 'video'; // 'video' or 'shorts'
let searchCache = { video: {}, shorts: {} };
let history = [];
let lastItems = [];
let nextToken = "";

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(mode === 'video' ? 'menu-home' : 'menu-shorts').classList.add('active');
    goHome(true);
}

async function startSearch(isMore = false) {
    const q = document.getElementById('q').value;
    if(!q) return;
    
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('watch-view').style.display = 'none';

    // モードによって検索ワードを調整 (ショートなら "#shorts" を自動付与)
    const searchQuery = currentMode === 'shorts' ? `${q} #shorts` : q;

    if(!isMore && searchCache[currentMode][q]) {
        lastItems = searchCache[currentMode][q];
        renderHome(lastItems);
        return;
    }

    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(searchQuery)}&type=video&maxResults=20&key=${KEY}${isMore ? `&pageToken=${nextToken}` : ''}`;
    
    const res = await fetch(url);
    const data = await res.json();
    nextToken = data.nextPageToken || "";

    if(isMore) {
        lastItems.push(...data.items);
    } else {
        lastItems = data.items;
        searchCache[currentMode][q] = lastItems;
    }
    
    renderHome(lastItems);
    document.getElementById('load-more').style.display = nextToken ? 'block' : 'none';
}

function renderHome(items) {
    const container = document.getElementById('results');
    container.innerHTML = items.map((item, i) => `
        <div class="v-card" onclick="play(${i})">
            <img src="${item.snippet.thumbnails.high.url}">
            <h3>${item.snippet.title}</h3>
        </div>
    `).join('');
}

function play(index) {
    const item = lastItems[index];
    const id = item.id.videoId;
    
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('watch-view').style.display = 'block';
    document.getElementById('v-title').innerText = item.snippet.title;

    // Kahoot! 認証突破URL
    const url = `https://www.youtubeeducation.com/embed/${id}?autoplay=1&origin=https%3A%2F%2Fcreate.kahoot.it&enablejsapi=1&embed_config=%7B%22enc%22%3A%22${ENC}%22%2C%22hideTitle%22%3Atrue%7D`;
    document.getElementById('player-container').innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;

    // 関連動画（今選んだの以外のリスト）を右側に
    const side = document.getElementById('side-results');
    side.innerHTML = lastItems.map((v, i) => i === index ? '' : `
        <div class="s-card" onclick="play(${i})">
            <img src="${v.snippet.thumbnails.medium.url}">
            <h3>${v.snippet.title}</h3>
        </div>
    `).join('');
    
    if(!history.find(h => h.id === id)) history.unshift({id, title: item.snippet.title, items: lastItems});
}

function goHome(clear) {
    if(clear) {
        document.getElementById('q').value = "";
        document.getElementById('results').innerHTML = "";
    }
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('watch-view').style.display = 'none';
    document.getElementById('player-container').innerHTML = '';
}

function showHistory() {
    document.getElementById('results').innerHTML = history.map(h => `<div class="v-card"><h3>${h.title} (再生済み)</h3></div>`).join('');
}
</script>
</body>
</html>
