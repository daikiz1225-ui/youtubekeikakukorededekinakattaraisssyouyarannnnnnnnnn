<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ボタンの認識をさらに強化 */
        #settings-trigger {
            appearance: none;
            -webkit-appearance: none;
            background: #333;
            border: 2px solid #444;
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: auto;
            display: block;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* タップ時の青枠を消す */
        }

        /* モーダルの基本状態（非表示） */
        #settings-modal {
            display: none; /* 最初は隠す */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* このクラスがついた時だけ表示される（強制！） */
        #settings-modal.active {
            display: flex !important;
        }

        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="logo">kick tube</div>
        <nav id="channel-list"></nav>
        <button id="settings-trigger" type="button">⚙️ 設定を開く</button>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="動画を検索..." autocomplete="off">
                <button id="search-button" type="button">検索</button>
            </div>
        </header>

        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">
                    設定からPipedドメインを入力してください
                </div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div id="player-container"></div>
            <div id="video-controls" style="padding:20px; text-align:center;">
                <button id="reload-video" class="btn">🔄 再読み込み</button>
                <button id="back-to-home" class="btn">⬅️ 戻る</button>
            </div>
        </section>
    </main>

    <div id="settings-modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">設定</h2>
            <div id="api-inputs"></div>
            <button id="save-settings-btn" style="width: 100%; padding: 15px; background: #ff0000; color: white; border: none; border-radius: 8px; margin-top: 20px; font-weight: bold; cursor: pointer;">保存して閉じる</button>
        </div>
    </div>

    <script type="module" src="js/instance-manager.js?v=1.2"></script>
    <script type="module" src="js/ui-switcher.js?v=1.2"></script>
    <script type="module" src="js/search-engine.js?v=1.2"></script>
    <script type="module" src="js/thumbnail-list.js?v=1.2"></script>
    <script type="module" src="js/player.js?v=1.2"></script>
    <script type="module" src="js/settings.js?v=1.2"></script>
    <script type="module" src="js/main.js?v=1.2"></script>

</body>
</html>
