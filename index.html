                        <h2>1. Pythonとは？ - 汎用性とシンプルさの秘密</h2>
                        <p>Python（パイソン）は、1991年にオランダ人のグイド・ヴァンロッサム氏によって公開されたオープンソースのプログラミング言語です。その最大の特徴は、<b>「読みやすく、書きやすい」</b>ことにあります。初心者にとっての学習障壁が低く、一方でプロフェッショナルな現場でも耐えうる高度な拡張性を備えています。</p>
                        <p>現在、PythonはWeb開発（Django, Flask）、データサイエンス（Pandas, NumPy）、人工知能・機械学習（PyTorch, TensorFlow）、業務自動化（スクレイピング, RPA）など、あらゆる分野で主役として君臨しています。Google、Meta、Netflixといった世界的なテック企業も、そのシステムの基盤にPythonを採用しています。</p>

                        <h2>2. 主要なデータ型と変数</h2>
                        <p>Pythonは「動的型付け」を採用しており、変数を宣言する際に型を明示する必要はありません。しかし、内部的には厳密に型を管理しています。以下に、頻繁に使用される基本的なデータ型をまとめます。</p>
                        
                        <table>
                            <thead>
                                <tr>
                                    <th>カテゴリ</th>
                                    <th>型名 (class)</th>
                                    <th>内容の説明</th>
                                    <th>具体例</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>数値型</td>
                                    <td>int / float</td>
                                    <td>整数、および浮動小数点数を扱います。</td>
                                    <td>10, 3.14</td>
                                </tr>
                                <tr>
                                    <td>文字列型</td>
                                    <td>str</td>
                                    <td>テキストデータを扱います。シングル/ダブルクォートで囲みます。</td>
                                    <td>"Hello Python"</td>
                                </tr>
                                <tr>
                                    <td>論理型</td>
                                    <td>bool</td>
                                    <td>真(True)か偽(False)の二値の状態を表します。</td>
                                    <td>True, False</td>
                                </tr>
                                <tr>
                                    <td>リスト型</td>
                                    <td>list</td>
                                    <td>複数の値を順番に格納します。後からの変更が可能です。</td>
                                    <td>[1, 2, 3]</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="info-b">
                            <h3>🐍 Pythonの「インデント」という哲学</h3>
                            <p>他の多くの言語（C言語やJavaなど）では、コードのまとまりを波括弧 { } で囲みますが、Pythonでは「インデント（字下げ）」を使用して表現します。これにより、誰が書いても同じ構造に見えるようになり、コードの可読性が飛躍的に向上しています。</p>
                        </div>

                        <h2>3. 制御構文：条件分岐とループ</h2>
                        <p>プログラムの流れを制御するために、if文による条件分岐や、for文・while文による繰り返し処理を行います。Pythonの制御構文は非常に直感的です。</p>
                        
                        <h3>if文による条件分岐</h3>
                        <div class="code-v">
                            <span class="kw">score</span> <span class="op">=</span> <span class="kw">85</span><br>
                            <span class="kw">if</span> score <span class="op">>=</span> <span class="kw">80</span>:<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">print</span>(<span class="st">"優秀な成績です！"</span>)<br>
                            <span class="kw">elif</span> score <span class="op">>=</span> <span class="kw">60</span>:<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">print</span>(<span class="st">"合格です。"</span>)<br>
                            <span class="kw">else</span>:<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">print</span>(<span class="st">"再試験が必要です。"</span>)
                        </div>

                        <h3>for文による反復処理</h3>
                        <p>Pythonのfor文は、リストや範囲（range）などのイテラブル（反復可能）なオブジェクトから要素を順番に取り出すために使用されます。</p>
                        <div class="code-v">
                            <span class="cm"># 0から4まで順番に出力</span><br>
                            <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="kw">5</span>):<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">print</span>(f<span class="st">"{i} 回目のループ処理を実行中..."</span>)<br><br>
                            <span class="cm"># リストの要素を処理</span><br>
                            fruits <span class="op">=</span> [<span class="st">"apple"</span>, <span class="st">"banana"</span>, <span class="st">"cherry"</span>]<br>
                            <span class="kw">for</span> fruit <span class="kw">in</span> fruits:<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">print</span>(f<span class="st">"大好物は {fruit} です。"</span>)
                        </div>

                        <h2>4. 関数の定義とモジュール化</h2>
                        <p>同じ処理を何度も繰り返す場合や、プログラムを整理する場合には「関数（Function）」を定義します。defキーワードを使用して定義を行い、必要に応じて戻り値（return）を設定します。</p>
                        <div class="code-v">
                            <span class="kw">def</span> <span class="fn">calculate_area</span>(radius):<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">"""円の面積を計算する関数"""</span><br>
                            &nbsp;&nbsp;&nbsp;&nbsp;pi <span class="op">=</span> <span class="kw">3.14159</span><br>
                            &nbsp;&nbsp;&nbsp;&nbsp;area <span class="op">=</span> pi <span class="op">*</span> (radius <span class="op">**</span> <span class="kw">2</span>)<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> area<br><br>
                            <span class="cm"># 関数の呼び出し</span><br>
                            result <span class="op">=</span> <span class="fn">calculate_area</span>(<span class="kw">5</span>)<br>
                            <span class="fn">print</span>(f<span class="st">"半径5の円の面積は {result} です。"</span>)
                        </div>

                        <h2>5. リスト・辞書・タプルの使い分け表</h2>
                        <p>Pythonには「コンテナ型」と呼ばれる、複数のデータをまとめて扱う型がいくつかあります。それぞれの特性を理解し、適切に使い分けることが効率的なプログラミングへの近道です。</p>

                        <table>
                            <thead>
                                <tr>
                                    <th>型名</th>
                                    <th>記法</th>

                                    <th>主な利用シーン</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><b>リスト (list)</b></td>
                                    <td>[a, b]</td>
                                    <td>〇 可能</td>
                                    <td>順序があるデータの集合、スタック、キューなど。</td>

                                <tr>

                                    <td>(a, b)</td>

                                </tr>
                                <tr>
                                    <td><b>辞書 (dict)</b></td>
                                    <td>{k: v}</td>
                                    <td>〇 可能</td>
                                    <td>キーと値のペアでデータを管理。検索効率が極めて高い。</td>
                                </tr>
                                <tr>
                                    <td><b>集合 (set)</b></td>
                                    <td>{a, b}</td>
                                    <td>〇 可能</td>
                                    <td>重複を許さないデータの集合、集合演算（和集合など）。</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="warning-b">
                            <h3>⚠️ 学習上の注意：バージョンについて</h3>
                            <p>現在、Pythonは「Python 3.x」が標準です。古い書籍やウェブサイトでは「Python 2.x」の解説が残っている場合がありますが、文法が大きく異なる（例：printが文ではなく関数になった等）ため、必ずPython 3をターゲットに学習を進めてください。</p>
                        </div>
                        
                        <p>最後に、Pythonはその膨大なコミュニティによって支えられています。エラーに遭遇した際は、エラーメッセージをコピーして検索するだけで、世界中のエンジニアによる解決策がすぐに見つかるはずです。これこそが、Pythonが世界最強の言語の一つである理由です。</p>
