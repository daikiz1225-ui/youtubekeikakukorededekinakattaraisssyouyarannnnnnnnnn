<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kick tube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside id="sidebar">
        <div class="logo">kick tube</div>
        <nav id="channel-list">
            </nav>
        
        <div id="settings-trigger" style="cursor: pointer; margin-top: auto; padding: 20px; background: #333; border-radius: 10px; text-align: center; color: white;">
            ⚙️ 設定を開く
        </div>
    </aside>

    <main id="main-content">
        <header id="search-header">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="動画を検索..." autocomplete="off">
                <button id="search-button">検索</button>
            </div>
        </header>

        <section id="view-home" class="view">
            <div id="search-results" class="video-grid">
                <div style="text-align:center; padding:50px; color:#888;">
                    設定からPipedドメインを入力してください
                </div>
            </div>
        </section>

        <section id="view-player" class="view" style="display: none;">
            <div id="player-container"></div>
            <div id="video-controls" style="padding:20px; text-align:center;">
                <button id="reload-video" style="padding:10px 20px;">🔄 再読み込み</button>
                <button id="back-to-home" style="padding:10px 20px;">⬅️ 戻る</button>
            </div>
        </section>
    </main>

    <div id="settings-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999;">
        <div class="modal-content" style="background: #222; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; color: white;">
            <h2>設定</h2>
            <div id="api-inputs"></div>
            <button id="save-settings-btn" style="width: 100%; padding: 15px; background: #ff0000; color: white; border: none; border-radius: 8px; margin-top: 20px;">保存して閉じる</button>
        </div>
    </div>

    <script type="module" src="js/instance-manager.js"></script>
    <script type="module" src="js/ui-switcher.js"></script>
    <script type="module" src="js/search-engine.js"></script>
    <script type="module" src="js/thumbnail-list.js"></script>
    <script type="module" src="js/player.js"></script>
    <script type="module" src="js/settings.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
